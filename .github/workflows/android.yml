name: Android APK
on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', 'tests/**', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: halo-calc-personal-debug-keystore-v2
      - name: Prepare persistent test signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build offline APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Halo-Calc.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-Calc-APK
          path: Halo-Calc.apk
      - name: Publish personal test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" Halo-Calc.apk --title "Halo Calc · build ${{ github.run_number }}" --notes "APK de teste para uso pessoal. Não publicado na Play Store. Faça backup no app antes de trocar instalações." --prerelease
