name: Android APK
on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', 'tests/**', 'package.json', '.github/workflows/android.yml', 'scripts/restore-signing.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Restore the existing signing key from repository secrets
        env:
          HALO_SIGNING_BASE64: ${{ secrets.HALO_EXISTING_KEYSTORE_BASE64 }}
          HALO_SIGNING_CERT_SHA256: ${{ secrets.HALO_EXISTING_CERT_SHA256 }}
        run: |
          python3 scripts/restore-signing.py "$RUNNER_TEMP/halo-signing.keystore"
          echo "HALO_EXISTING_KEYSTORE_PATH=$RUNNER_TEMP/halo-signing.keystore" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build offline APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Halo-Calc.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-Calc-APK
          path: Halo-Calc.apk
      - name: Publish personal test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" Halo-Calc.apk --title "Halo Calc · build ${{ github.run_number }}" --notes "APK de teste. Atualiza os builds 7 e seguintes com a mesma assinatura, sem desinstalar. Não publicado na Play Store." --prerelease
      - name: Remove private signing material from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/halo-signing.keystore"
