          PUBLIC_CERT
          test -s "$HOME/.android/debug.keystore"
          openssl cms -encrypt -binary -aes256 -in "$HOME/.android/debug.keystore" -out "$RUNNER_TEMP/halo-signing-key.p7m" -outform DER "$RUNNER_TEMP/owner-public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-halo-signing-key
          path: ${{ runner.temp }}/halo-signing-key.p7m
          retention-days: 1
