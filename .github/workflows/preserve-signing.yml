name: Preserve existing Halo signing key
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: halo-calc-personal-debug-keystore-v2
          fail-on-cache-miss: true
      - name: Encrypt existing key for its owner
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/owner-public.pem" <<'PUBLIC_CERT'
          -----BEGIN CERTIFICATE-----
          MIIELTCCApWgAwIBAgIUDXnUfD9/P6bJSbMWjZ9iMeS6MIEwDQYJKoZIhvcNAQEL
          BQAwJjEkMCIGA1UEAwwbSGFsbyBDYWxjIHNpZ25pbmcgbWlncmF0aW9uMB4XDTI2
